<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Overlap Screensaver</title>
<meta name="description" content="A pump and a probe beam drift around the screen like an old TV screensaver; the corner shows their overlap.">
<style>
/* A black screen with two glowing beam spots. Deliberately single-theme: it is a screensaver. */
:root {
  color-scheme: dark;
  --bg: #000;
  --ink: rgba(236, 241, 248, 0.62);
  --ink-strong: rgba(246, 249, 252, 0.88);
  --ink-dim: rgba(236, 241, 248, 0.36);
  --font: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud {
  position: fixed;
  top: calc(14px + env(safe-area-inset-top, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  text-align: right;
  font: 12px/1.5 var(--font);
  letter-spacing: 0.04em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  user-select: none;
}
.hud b { font-weight: 500; color: var(--ink-strong); }
.info {
  position: fixed;
  left: calc(16px + env(safe-area-inset-left, 0px));
  right: 16px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  font: 11px/1.6 var(--font);
  color: var(--ink-dim);
  opacity: 0;
  transition: opacity 0.6s ease;
  pointer-events: none;
}
.info i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.info b { font-weight: 500; color: var(--ink); }
.info a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
.info a:hover, .info a:focus-visible { color: var(--ink-strong); }
body.awake .info { opacity: 1; pointer-events: auto; }
body:not(.awake) { cursor: none; }
@media (prefers-reduced-motion: reduce) { .info { transition: none; } }
</style>
</head>
<body class="awake">
<canvas id="cv" aria-label="A pump beam and a probe beam drifting and bouncing off the edges of the screen"></canvas>
<div class="hud">
  <div>overlap <b id="ov">0.0%</b></div>
</div>
<div class="info" id="info"></div>
<script>
(function () {
  'use strict';

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const C_UM_PER_FS = 0.299792458;
  const TAIL_STRETCH = 2.5; // pulse length c·τ drawn 2.5× longer, so short pulses still show
  const TAIL_ALPHA = 0.5;
  const TAIL_WIDTH = 0.55; // streak width as a fraction of the spot

  // ------------------------------------------------------------------ seeds
  // A seed fixes every random choice: colour, sizes, pulse lengths, start positions, directions.
  // Put it in the address as …/#48213, …/#anyword or …/?seed=48213. Without one, every load
  // picks a fresh seed.
  const SEED_RE = /^[A-Za-z0-9._~-]{1,32}$/;

  // Named seeds with hand-picked setups. Each gets the seeded setup `s` and may change any of it.
  const SPECIAL_SEEDS = {
    // Ti:sapphire with a frequency-doubled pump: 400 nm pump, 800 nm probe, 100 fs pulses.
    classic(s) {
      s.pump.lambda = 400;
      s.pump.fwhm = 100;
      s.probe.fwhm = 100;
    },
    // Matched beams that travel together, so the overlap never drops.
    perfect(s) {
      s.probe.w0 = s.pump.w0;
      s.probe.fwhm = s.pump.fwhm;
      s.together = true;
    },
  };

  function mulberry32(a) {
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // FNV-1a, so any word works as a seed.
  function hashString(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
  }
  const seedNumber = (token) => (/^\d{1,9}$/.test(token) ? Number(token) >>> 0 : hashString(token.toLowerCase()));
  const freshSeed = () => String(10000 + Math.floor(Math.random() * 990000));

  function seedFromUrl() {
    let h = '';
    try {
      h = decodeURIComponent(location.hash.slice(1));
    } catch (e) {
      h = '';
    }
    if (SEED_RE.test(h)) return h;
    const q = new URLSearchParams(location.search).get('seed');
    return q && SEED_RE.test(q) ? q : null;
  }

  // Everything random comes from here. Keep the order of the draws: changing it changes what
  // every existing seed looks like.
  function makeSetup(token) {
    const rng = mulberry32(seedNumber(token));
    const r = (a, b) => a + (b - a) * rng();
    const sign = () => (rng() < 0.5 ? -1 : 1);
    const s = {
      pump: { lambda: Math.round(r(400, 600)), w0: Math.round(r(40, 110)), fwhm: Math.round(r(25, 250)) },
      probe: { lambda: 800, w0: Math.round(r(20, 75)), fwhm: Math.round(r(20, 150)) },
      together: false,
    };
    // Start positions as fractions of the free area, and launch directions.
    s.start = [0, 1].map(() => ({ fx: rng(), fy: rng(), speed: r(55, 80), angle: r(25, 65), sx: sign(), sy: sign() }));
    const special = SPECIAL_SEEDS[token.toLowerCase()];
    if (special) special(s);
    if (s.together) s.start[1] = Object.assign({}, s.start[0]);
    return s;
  }

  // ------------------------------------------------------------------ beams

  // Wavelength to a display colour (visible), with near-IR shown as a false-colour crimson.
  function waveRGB(nm) {
    let c;
    if (nm > 780) c = [0.9, 0.1, 0.42];
    else if (nm < 440) c = [(440 - nm) / 60, 0, 1];
    else if (nm < 490) c = [0, (nm - 440) / 50, 1];
    else if (nm < 510) c = [0, 1, (510 - nm) / 20];
    else if (nm < 580) c = [(nm - 510) / 70, 1, 0];
    else if (nm < 645) c = [1, (645 - nm) / 65, 0];
    else c = [1, 0, 0];
    const lum = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    const k = Math.max(0, 0.26 - lum) * 0.8; // lift deep blue/violet so it reads on black
    return c.map((v) => Math.min(1, v + k));
  }

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, k = 1; // css px, and px per µm on screen
  let seed = '';
  let pump = null, probe = null, beams = [];
  let together = false;
  let signalSprite = null;

  // A Gaussian spot exp(−2r²/w²) as a radial-gradient sprite, drawn additively.
  function spotSprite(rgb, radiusPx, peak) {
    const R = Math.ceil(2.2 * radiusPx);
    const c = document.createElement('canvas');
    c.width = c.height = 2 * R;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(R, R, 0, R, R, R);
    for (let i = 0; i <= 20; i++) {
      const s = i / 20;
      const r = s * R;
      const a = peak * Math.exp((-2 * r * r) / (radiusPx * radiusPx));
      grad.addColorStop(s, `rgba(${Math.round(rgb[0] * 255)},${Math.round(rgb[1] * 255)},${Math.round(rgb[2] * 255)},${a.toFixed(4)})`);
    }
    g.fillStyle = grad;
    g.fillRect(0, 0, 2 * R, 2 * R);
    return { canvas: c, R };
  }

  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    k = clamp(Math.min(W, H) / 650, 0.45, 2.2);
    for (const b of beams) {
      b.r = b.w0 * k;
      b.sprite = spotSprite(b.rgb, b.r, 0.92);
      // Temporal profile as a faint streak ahead of and behind the spot: a Gaussian whose
      // 1/e² half-length is the pulse length c·τ (stretched), on the same µm scale as the waist.
      const tailW = (TAIL_STRETCH * C_UM_PER_FS * b.fwhm) / Math.sqrt(2 * Math.LN2) * k;
      b.stretch = Math.hypot(b.r, tailW) / b.r;
      b.x = clamp(b.x, b.r, Math.max(b.r, W - b.r));
      b.y = clamp(b.y, b.r, Math.max(b.r, H - b.r));
    }
    // The product of the two spots is another Gaussian, with 1/w² = 1/w₁² + 1/w₂².
    const we = (pump.w0 * probe.w0) / Math.hypot(pump.w0, probe.w0);
    signalSprite = spotSprite([1, 1, 1], we * k, 1);
  }

  // Like the old logo: a slow diagonal drift, never close to horizontal or vertical.
  function place(b, st) {
    b.x = b.r + st.fx * Math.max(0, W - 2 * b.r);
    b.y = b.r + st.fy * Math.max(0, H - 2 * b.r);
    const speed = st.speed * Math.sqrt(k) * (reduced ? 0.5 : 1);
    const a = (st.angle * Math.PI) / 180;
    b.vx = speed * Math.cos(a) * st.sx;
    b.vy = speed * Math.sin(a) * st.sy;
    b.flash = 0;
    b.lastX = -1;
    b.lastY = -1;
    b.ang = Math.atan2(b.vy, b.vx);
  }

  function init(token) {
    seed = token;
    const s = makeSetup(token);
    pump = Object.assign({ name: 'pump' }, s.pump);
    probe = Object.assign({ name: 'probe' }, s.probe);
    beams = [pump, probe];
    together = s.together;
    for (const b of beams) {
      b.rgb = waveRGB(b.lambda);
      b.x = 0;
      b.y = 0;
    }
    resize();
    beams.forEach((b, i) => place(b, s.start[i]));
    // Start the two spots apart so the first meeting is something to wait for.
    if (!together && Math.hypot(pump.x - probe.x, pump.y - probe.y) < pump.r + probe.r) {
      pump.x = pump.r;
      pump.y = pump.r;
      probe.x = Math.max(probe.r, W - probe.r);
      probe.y = Math.max(probe.r, H - probe.r);
    }
    renderInfo();
  }

  // The streak follows the direction of travel. It is symmetric, so its axis only matters modulo
  // π; it swings round smoothly after a bounce instead of snapping.
  function steer(b, dt) {
    let d = Math.atan2(b.vy, b.vx) - b.ang;
    d = ((((d + Math.PI / 2) % Math.PI) + Math.PI) % Math.PI) - Math.PI / 2;
    b.ang += d * Math.min(1, dt * 5);
  }

  function step(b, dt, now) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    const right = Math.max(b.r, W - b.r);
    const bottom = Math.max(b.r, H - b.r);
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); b.lastX = now; }
    else if (b.x > right) { b.x = right; b.vx = -Math.abs(b.vx); b.lastX = now; }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); b.lastY = now; }
    else if (b.y > bottom) { b.y = bottom; b.vy = -Math.abs(b.vy); b.lastY = now; }
    // Corner hit: both walls within a tenth of a second.
    if (b.lastX > 0 && b.lastY > 0 && Math.abs(b.lastX - b.lastY) < 100 && Math.max(b.lastX, b.lastY) === now) b.flash = 1;
    b.flash = Math.max(0, b.flash - dt * 0.8);
  }

  // Intensity-weighted overlap of the two spots: 1 when they sit on top of each other.
  function overlap() {
    const d = Math.hypot(pump.x - probe.x, pump.y - probe.y) / k; // µm
    return Math.exp((-2 * d * d) / (pump.w0 * pump.w0 + probe.w0 * probe.w0));
  }

  const ovEl = document.getElementById('ov');
  let lastText = 0;
  let last = 0;

  function frame(now) {
    const dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    for (const b of beams) {
      step(b, dt, now);
      steer(b, dt);
    }
    const o = overlap();

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of beams) {
      const s = b.sprite;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.ang);
      ctx.globalAlpha = TAIL_ALPHA;
      ctx.drawImage(s.canvas, -s.R * b.stretch, -s.R * TAIL_WIDTH, 2 * s.R * b.stretch, 2 * s.R * TAIL_WIDTH);
      ctx.restore();
      ctx.globalAlpha = 1;
      ctx.drawImage(s.canvas, b.x - s.R, b.y - s.R);
      if (b.flash > 0) {
        ctx.globalAlpha = b.flash;
        ctx.drawImage(s.canvas, b.x - s.R, b.y - s.R);
      }
    }
    // Signal: where the pump and probe meet.
    if (o > 0.002) {
      const wp2 = pump.w0 * pump.w0;
      const wr2 = probe.w0 * probe.w0;
      const cx = (pump.x * wr2 + probe.x * wp2) / (wp2 + wr2);
      const cy = (pump.y * wr2 + probe.y * wp2) / (wp2 + wr2);
      ctx.globalAlpha = Math.min(1, o);
      ctx.drawImage(signalSprite.canvas, cx - signalSprite.R, cy - signalSprite.R);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (now - lastText > 100) {
      lastText = now;
      ovEl.textContent = (o * 100).toFixed(1) + '%';
    }
    requestAnimationFrame(frame);
  }

  // ------------------------------------------------------------------ info and seed links

  // Beam details and the seed appear while the pointer moves, then fade away again.
  const info = document.getElementById('info');
  const dot = (b) => `<i style="background:rgb(${b.rgb.map((v) => Math.round(v * 255)).join(',')})"></i>`;
  function renderInfo() {
    // `seed` always matches SEED_RE, so it is safe to put in markup.
    const inUrl = seedFromUrl() === seed;
    info.innerHTML =
      `${dot(pump)}pump ${pump.lambda} nm · w₀ ${pump.w0} µm · ${pump.fwhm} fs<br>` +
      `${dot(probe)}probe ${probe.lambda} nm · w₀ ${probe.w0} µm · ${probe.fwhm} fs<br>` +
      `seed <b>${seed}</b>` +
      (inUrl ? '' : ` · <a href="#${seed}" id="keep-seed">keep this seed</a>`) +
      ' · <a href="./" id="new-seed">new seed</a> · double-click for full screen';
  }

  // URL without any seed, so a refresh picks fresh beams again.
  function urlWithoutSeed() {
    const u = new URL(location.href);
    u.hash = '';
    u.searchParams.delete('seed');
    return u.pathname + (u.search || '');
  }

  info.addEventListener('click', (ev) => {
    const a = ev.target.closest('a');
    if (!a || a.id !== 'new-seed') return;
    ev.preventDefault();
    try {
      history.replaceState(null, '', urlWithoutSeed());
    } catch (e) { /* the address bar is optional */ }
    init(freshSeed());
  });
  info.addEventListener('dblclick', (ev) => ev.stopPropagation());

  window.addEventListener('hashchange', () => {
    const t = seedFromUrl();
    if (t && t !== seed) init(t);
    else renderInfo();
  });

  let sleepTimer = 0;
  document.body.classList.add('awake');
  function wake() {
    document.body.classList.add('awake');
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(() => document.body.classList.remove('awake'), 3000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach((e) => window.addEventListener(e, wake, { passive: true }));
  sleepTimer = setTimeout(() => document.body.classList.remove('awake'), 4000);

  window.addEventListener('dblclick', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) { /* full screen is optional */ }
  });
  window.addEventListener('resize', resize);

  init(seedFromUrl() || freshSeed());
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
